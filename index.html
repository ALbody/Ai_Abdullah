<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI ChatBot</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
  <div class="chat-container">
    <header class="chat-header">
      <h3>AI ChatBot</h3>
      <button id="info-btn" class="btn btn-info">About</button>
    </header>

    <div class="chat-body" id="chat-body"></div>

    <form id="chat-form" class="chat-form">
      <input type="file" id="file-input" hidden>
      <button type="button" id="file-upload" class="btn btn-secondary">Attach</button>
      <textarea class="message-input" placeholder="Type a message..."></textarea>
      <button type="submit" id="send-message" class="btn btn-primary">Send</button>
    </form>

    <div class="chat-footer text-center mt-3">
      <button id="whatsapp-btn" class="btn btn-success">Send to WhatsApp</button>
    </div>
  </div>

  <div id="user-info" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h5>Abdullah Salah</h5>
      <p>Phone: 01019890771</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
