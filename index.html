<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chatbot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="chat-container">
    <!-- Chat Header -->
    <div class="chat-header">
      <h2>AI Chatbot</h2>
      <button id="close-chatbot">x</button>
    </div>

    <!-- Chat Body -->
    <div class="chat-body">
      <div class="message bot-message">
        <div class="message-text">Hello! How can I assist you today?</div>
      </div>
    </div>

    <!-- Chat Footer -->
    <div class="chat-footer">
      <form class="chat-form" action="#" id="chat-form">
        <textarea class="message-input" placeholder="Type your message..." required></textarea>
        <button type="submit" id="send-message">Send</button>
      </form>
    </div>

    <!-- About Button -->
    <a href="page2.html" id="about-button">About</a>
  </div>

  <script src="script.js"></script>
</body>
</html>
