<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chatbot</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,400,1,0" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header-info">
    <svg class="chatbot-logo" xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 1024 1024">
      <!-- Logo SVG path -->
    </svg>
    <h2 class="logo-text">Chatbot</h2>
    <a href="https://wa.me/201019890771" target="_blank" id="whatsapp-button" class="whatsapp-button">Contact Us on WhatsApp</a>
  </header>

  <div class="chat-container">
    <div class="chat-header">
      <button id="close-chatbot" class="material-symbols-rounded">keyboard_arrow_down</button>
    </div>

    <div class="chat-body">
      <div class="message bot-message">
        <div class="message-text">Hey there! How can I help you today?</div>
      </div>
    </div>

    <div class="chat-footer">
      <form action="#" class="chat-form">
        <textarea placeholder="Type a message..." class="message-input" required></textarea>
        <button type="button" id="send-message" class="material-symbols-rounded">send</button>
      </form>
    </div>
  </div>

  <footer class="footer-info">
    <p>About: Abdullah Salah - 01019890771</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
