<!DOCTYPE html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Chatbot</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="chat-container">
      <div class="chat-header">
        <h2>Chatbot</h2>
        <button id="close-chatbot">X</button>
      </div>
      <div class="chat-body">
        <div class="message bot-message">
          <div class="message-text">Hello! How can I assist you?</div>
        </div>
      </div>
      <div class="chat-footer">
        <form class="chat-form">
          <textarea class="message-input" placeholder="Message..." required></textarea>
          <button type="submit" class="send-button">Send</button>
        </form>
      </div>
    </div>
    <footer>
      <p>Developed by Abdullah Salah</p>
    </footer>
    <button id="chatbot-toggler">Chat</button>
    <script src="script.js"></script>
  </body>
</html>
