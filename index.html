<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مساعد ذكي - عبدالله صلاح</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
  </head>
  <body>
    <header class="main-header">
      <h1>مساعد عبدالله صلاح</h1>
      <button id="whatsapp-button" title="تواصل واتساب">
        <span class="material-symbols-outlined">chat</span>
      </button>
    </header>

    <main class="chat-container">
      <section class="chat-body"></section>

      <form class="chat-form">
        <textarea class="message-input" placeholder="اكتب رسالتك..." required></textarea>
        <button id="send-message" type="submit">
          <span class="material-symbols-outlined">send</span>
        </button>
      </form>
    </main>

    <script src="script.js"></script>
  </body>
</html>
